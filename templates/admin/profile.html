{% extends "admin/base.html" %}
{% set active_admin = 'profile' %}
{% block admin_content %}
<section class="panel narrow-panel">
  <header class="panel-head"><h2>Change password</h2></header>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button class="btn" type="submit">Update password</button>
  </form>
</section>

<section class="panel narrow-panel">
  <header class="panel-head"><h2>Account</h2></header>
  <p class="muted">Signed in as <strong>{{ g.user.username }}</strong>{% if g.user.email %} ({{ g.user.email }}){% endif %}.</p>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-ghost" type="submit">Sign out</button>
  </form>
</section>
{% endblock %}
