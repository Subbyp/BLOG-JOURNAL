{% if pagination and pagination.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if pagination.has_prev %}
    <a class="page-link" rel="prev" href="{{ page_url(pagination.prev_num) }}">← Newer</a>
  {% else %}
    <span class="page-link disabled">← Newer</span>
  {% endif %}

  <span class="page-status">Page {{ pagination.page }} of {{ pagination.total_pages }}</span>

  {% if pagination.has_next %}
    <a class="page-link" rel="next" href="{{ page_url(pagination.next_num) }}">Older →</a>
  {% else %}
    <span class="page-link disabled">Older →</span>
  {% endif %}
</nav>
{% endif %}
